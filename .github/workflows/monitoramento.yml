name: Monitoramento - Moça do Bolo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  disponibilidade:
    name: Verificar aplicação publicada
    runs-on: ubuntu-latest

    steps:
      - name: Testar URL pública
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            https://gabrielalvesoliver27-spec.github.io/moca-do-bolo-mvp/prototipo/ \
            > /dev/null
